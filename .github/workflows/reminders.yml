name: Send Reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          curl -f -X POST "https://fih.vercel.app/api/cron/reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 30
